# General
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
CONFIG_UART_CONSOLE=y

# SD Card
CONFIG_SDHC=y
CONFIG_DISK_DRIVER_SDMMC=y

# Display
CONFIG_DISPLAY_MCUX_ELCDIF=y
CONFIG_MCUX_ELCDIF_FB_NUM=1
CONFIG_MCUX_ELCDIF_FB_SIZE=522240

# Display rotation
CONFIG_DMA=y
CONFIG_MCUX_PXP=y
CONFIG_MCUX_ELCDIF_PXP=y
CONFIG_MCUX_ELCDIF_PXP_ROTATE_270=y

# App
CONFIG_PLATFORM_DISPLAY_ROTATION_90=y
