manifest:
  version: "1.2"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nxp
          - fatfs
          - lvgl

    - name: tflite-micro
      url: https://github.com/zephyrproject-rtos/tflite-micro
      revision: fcc760af130f3a595b5802cdebcc77461e54f382
      path: modules/lib/tflite-micro

  self:
    path: app
